version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filadelfia_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production

# Nota: La base de datos se gestiona en Supabase (cloud).
# No se necesita un contenedor de base de datos local.
# Configura las credenciales de Supabase en el archivo .env

# volumes:
#   mysql_data: (eliminado - ya no se usa MySQL local)
